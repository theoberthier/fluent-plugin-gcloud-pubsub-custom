<match **>
  @type gcloud_pubsub

  # GCP Project
  project exemple 

  # Your Pub/Sub topic
  topic projects/exemple/topics/test

  # GCP key path; if not provided, Application Default Credentials (ADC) are used
  key /etc/fluent/gcloud-key.json

  # Autocreate topic if the required roles are provided
  autocreate_topic true

  # Maximum Pub/Sub request
  max_messages 1000

  # Maximum request size (bytes)
  max_total_size 9800000

  # Maximum message size (bytes)
  max_message_size 4000000

  # Message compression (nil or gzip)
  compression gzip

  # Key to extract from Pub/Sub 
  # attribute_keys env,service

  # Static values to target (uncomment if necessary)
  # attribute_key_values {"environment": "dev", "service": "fluentd"}

  # <buffer>
  #   @type memory
  #   flush_interval 5s
  #   chunk_limit_size 1m
  #   queue_limit_length 1000
  #   retry_type exponential_backoff
  #   retry_max_interval 30s
  #   retry_forever true
  # </buffer>
