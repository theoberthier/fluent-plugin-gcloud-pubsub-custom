<match **>
  @type gcloud_pubsub

  # GCP Project
  project exemple 

  # Votre topic Pub/Sub
  topic projects/exemple/topics/test

  # GCP key path if is not provide ADC is used
  key /etc/fluent/gcloud-key.json

  # Autocreate topic if the great roles is provided
  autocreate_topic true

  # Maximum Pub/Sub request
  max_messages 1000

  # Maximum request size (octets)
  max_total_size 9800000

  # Maximum message size (octets)
  max_message_size 4000000

  # Compression of message (nil ou gzip)
  compression gzip

  # Key to extract from Pub/Sub 
  # attribute_keys env,service

  # Static values to target (décommentez si nécessaire)
  # attribute_key_values {"environment": "dev", "service": "fluentd"}

  # <buffer>
  #   @type memory
  #   flush_interval 5s
  #   chunk_limit_size 1m
  #   queue_limit_length 1000
  #   retry_type exponential_backoff
  #   retry_max_interval 30s
  #   retry_forever true
  # </buffer>
